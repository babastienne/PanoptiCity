services:
  postgis:
    image: postgis/postgis:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file:
      - .env

  osm2pgsql:
    image: iboates/osm2pgsql:latest
    depends_on:
      - postgis
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPORT: 5432
      PGHOST: postgis
    volumes:
      - ./back-end:/data
      - ./osm-data:/osm-data
    env_file:
      - .env

  web:
    build: .
    container_name: django-docker
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - postgis
    volumes:
      - ./osm-data:/osm-data
      - ./back-end:/app
    environment:
      DJANGO_SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      DJANGO_ALLOWED_HOSTS: "${BACKEND_DOMAIN_NAME},web"
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BACKEND_DOMAIN_NAME=${BACKEND_DOMAIN_NAME}
      - FRONTEND_DOMAIN_NAME=${FRONTEND_DOMAIN_NAME}
      - NGINX_CACHE_SECRET_KEY=${NGINX_CACHE_SECRET_KEY}
    volumes:
      # Mount the active config as a template (envsubst will put it in /etc/nginx/conf.d/default.conf)
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./front-end:/usr/share/nginx/html:ro
      - ./scripts/nginx-entrypoint.sh:/usr/local/bin/nginx-entrypoint.sh:ro
      - nginx_cache:/var/cache/nginx
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/www/certbot:ro
    depends_on:
      - web
    # Use our custom script as the entrypoint
    entrypoint: ["/bin/sh", "/usr/local/bin/nginx-entrypoint.sh"]
    env_file:
      - .env

  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"


volumes:
  postgis_data:
  nginx_cache:
  certbot_etc:
  certbot_var:
