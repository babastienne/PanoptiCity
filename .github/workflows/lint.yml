name: Python Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: back-end/**/*.py
          files_ignore: |
            **/migrations/**
            **/__init__.py

      - name: Install System Dependencies (GDAL)
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pylint pylint-django
          if [ -f back-end/requirements.txt ]; then pip install -r back-end/requirements.txt; fi

      - name: Run Pylint
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          PYTHONPATH: back-end
          DJANGO_SETTINGS_MODULE: panopticity.settings
        run: |
          pylint ${{ steps.changed-files.outputs.all_changed_files }} \
            --load-plugins pylint_django \
            --disable=C0114,C0115,C0116,C0301,W0718,W0223,R0901,R0914
