<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- BACKGROUND -->
  <rect width="512" height="512" fill="#f8fafc"/> <!-- Wall -->
  <rect y="400" width="512" height="112" fill="#334155"/> <!-- Floor -->
  <rect y="400" width="512" height="8" fill="#1e293b"/> <!-- Baseboard -->

  <!-- CEILING LIGHTING -->
  <g id="Ceiling_Lights">
    <rect x="100" y="0" width="60" height="10" fill="#cbd5e1" rx="2"/>
    <rect x="226" y="0" width="60" height="10" fill="#cbd5e1" rx="2"/>
    <rect x="352" y="0" width="60" height="10" fill="#cbd5e1" rx="2"/>
    <!-- Light Glows (Soft vertical gradients) -->
    <rect x="90" y="10" width="80" height="390" fill="url(#lightGlow)"/>
    <rect x="216" y="10" width="80" height="390" fill="url(#lightGlow)"/>
    <rect x="342" y="10" width="80" height="390" fill="url(#lightGlow)"/>
  </g>

  <!-- MODULAR SHELVING UNIT (LEFT) -->
  <g id="Shelves">
    <!-- Vertical Supports -->
    <rect x="40" y="80" width="8" height="320" fill="#475569" rx="2"/>
    <rect x="220" y="80" width="8" height="320" fill="#475569" rx="2"/>
    
    <!-- Wooden Shelves -->
    <rect x="40" y="150" width="188" height="10" fill="#92400e" rx="2"/>
    <rect x="40" y="260" width="188" height="10" fill="#92400e" rx="2"/>
    <rect x="40" y="370" width="188" height="10" fill="#92400e" rx="2"/>

    <!-- Products - Top Shelf (Bottles) -->
    <rect x="60" y="100" width="15" height="50" fill="#60a5fa" rx="2"/>
    <rect x="80" y="95" width="15" height="55" fill="#f87171" rx="2"/>
    <rect x="110" y="110" width="20" height="40" fill="#34d399" rx="2"/>
    <rect x="140" y="100" width="15" height="50" fill="#fbbf24" rx="2"/>
    
    <!-- Products - Middle Shelf (Boxes) -->
    <rect x="70" y="210" width="40" height="50" fill="#818cf8" rx="4"/>
    <rect x="120" y="220" width="30" height="40" fill="#c084fc" rx="4"/>
    <rect x="160" y="215" width="35" height="45" fill="#f472b6" rx="4"/>

    <!-- Products - Bottom Shelf (Folded items) -->
    <rect x="60" y="340" width="50" height="30" fill="#94a3b8" rx="2"/>
    <rect x="120" y="340" width="50" height="30" fill="#64748b" rx="2"/>
    <rect x="180" y="340" width="30" height="30" fill="#475569" rx="2"/>
  </g>

  <!-- CHECKOUT COUNTER (RIGHT) -->
  <g id="Checkout">
    <!-- Counter Body -->
    <rect x="300" y="300" width="180" height="100" fill="#1e293b" rx="4"/>
    <rect x="290" y="290" width="200" height="12" fill="#475569" rx="2"/> <!-- Marble top -->
    
    <!-- POS System (Monitor) -->
    <rect x="340" y="240" width="60" height="50" rx="4" fill="#0f172a"/>
    <rect x="345" y="245" width="50" height="35" fill="#1e293b" rx="2"/>
    <path d="M360 290 L380 290 L375 300 H365 Z" fill="#0f172a"/> <!-- Stand -->
    
    <!-- Payment Terminal -->
    <rect x="420" y="265" width="30" height="25" rx="2" fill="#334155"/>
    <rect x="425" y="270" width="20" height="5" fill="#22c55e" opacity="0.6"/> <!-- Screen -->
  </g>

  <!-- DECORATIVE INDOOR PLANT -->
  <g id="Plant">
    <path d="M420 400 L430 460 H470 L480 400 Z" fill="#78350f"/> <!-- Pot -->
    <path d="M450 400 V350" stroke="#15803d" stroke-width="4"/> <!-- Stem -->
    <!-- Lush Leaves -->
    <circle cx="450" cy="340" r="25" fill="#22c55e" opacity="0.8"/>
    <circle cx="430" cy="360" r="20" fill="#16a34a" opacity="0.8"/>
    <circle cx="470" cy="360" r="22" fill="#15803d" opacity="0.8"/>
  </g>

  <!-- OPEN NEON SIGN -->
  <g id="Sign">
    <rect x="216" y="40" width="80" height="35" rx="17.5" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="256" y="65" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">OPEN</text>
  </g>

  <!-- SECURITY DETAILS (Context for Surveillance) -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- BACKGROUND -->
  <rect width="512" height="512" fill="#f8fafc"/> <!-- Wall -->
  <rect y="400" width="512" height="112" fill="#334155"/> <!-- Floor -->
  <rect y="400" width="512" height="8" fill="#1e293b"/> <!-- Baseboard -->

  <!-- CEILING LIGHTING -->
  <g id="Ceiling_Lights">
    <rect x="110" y="0" width="60" height="10" fill="#cbd5e1" rx="2"/>
    <rect x="226" y="0" width="60" height="10" fill="#cbd5e1" rx="2"/>
    <rect x="352" y="0" width="60" height="10" fill="#cbd5e1" rx="2"/>
    <!-- Light Glows -->
    <rect x="100" y="10" width="80" height="390" fill="url(#lightGlow)"/>
    <rect x="216" y="10" width="80" height="390" fill="url(#lightGlow)"/>
    <rect x="342" y="10" width="80" height="390" fill="url(#lightGlow)"/>
  </g>

  <!-- CEILING CAMERA (TOP LEFT) -->
  <g id="Corner_Camera">
    <!-- Mounting Base -->
    <rect x="20" y="0" width="50" height="8" fill="#adb5bd" rx="1"/>
    <rect x="25" y="8" width="40" height="4" fill="#64748b"/>
    <!-- Dome Housing -->
    <path d="M25 12 C 25 35, 65 35, 65 12 Z" fill="#1e293b"/>
    <path d="M30 12 C 30 30, 60 30, 60 12 Z" fill="#334155" opacity="0.6"/>
    <!-- Internal Lens -->
    <circle cx="45" cy="22" r="6" fill="#0f172a"/>
    <circle cx="47" cy="20" r="2" fill="#ffffff" opacity="0.3"/>
    <!-- Status LED -->
    <circle cx="55" cy="16" r="1.5" fill="#ef4444"/>
  </g>
  <g id="Security">
    <!-- Pinhole Motion Sensor on Wall -->
    <rect x="460" y="150" width="20" height="30" rx="4" fill="#cbd5e1"/>
    <circle cx="470" cy="160" r="4" fill="#475569"/>
    <!-- Convex Mirror Detail -->
  </g>

  <!-- MODULAR SHELVING UNIT -->
  <g id="Shelves">
    <rect x="40" y="80" width="8" height="320" fill="#475569" rx="2"/>
    <rect x="220" y="80" width="8" height="320" fill="#475569" rx="2"/>
    <rect x="40" y="150" width="188" height="10" fill="#92400e" rx="2"/>
    <rect x="40" y="260" width="188" height="10" fill="#92400e" rx="2"/>
    <rect x="40" y="370" width="188" height="10" fill="#92400e" rx="2"/>

    <!-- Products - Top -->
    <rect x="60" y="100" width="15" height="50" fill="#60a5fa" rx="2"/>
    <rect x="80" y="95" width="15" height="55" fill="#f87171" rx="2"/>
    <rect x="110" y="110" width="20" height="40" fill="#34d399" rx="2"/>
    <rect x="140" y="100" width="15" height="50" fill="#fbbf24" rx="2"/>
    
    <!-- Products - Mid -->
    <rect x="70" y="210" width="40" height="50" fill="#818cf8" rx="4"/>
    <rect x="120" y="220" width="30" height="40" fill="#c084fc" rx="4"/>
    <rect x="160" y="215" width="35" height="45" fill="#f472b6" rx="4"/>

    <!-- Products - Bottom -->
    <rect x="60" y="340" width="50" height="30" fill="#94a3b8" rx="2"/>
    <rect x="120" y="340" width="50" height="30" fill="#64748b" rx="2"/>
    <rect x="180" y="340" width="30" height="30" fill="#475569" rx="2"/>
  </g>

  <!-- CHECKOUT COUNTER -->
  <g id="Checkout">
    <rect x="300" y="300" width="180" height="100" fill="#1e293b" rx="4"/>
    <rect x="290" y="290" width="200" height="12" fill="#475569" rx="2"/>
    <rect x="340" y="240" width="60" height="50" rx="4" fill="#0f172a"/>
    <rect x="345" y="245" width="50" height="35" fill="#1e293b" rx="2"/>
    <path d="M360 290 L380 290 L375 300 H365 Z" fill="#0f172a"/>
    <rect x="420" y="265" width="30" height="25" rx="2" fill="#334155"/>
  </g>

  <!-- INDOOR PLANT -->
  <g id="Plant">
    <path d="M420 400 L430 460 H470 L480 400 Z" fill="#78350f"/>
    <path d="M450 400 V350" stroke="#15803d" stroke-width="4"/>
    <circle cx="450" cy="340" r="25" fill="#22c55e" opacity="0.8"/>
    <circle cx="430" cy="360" r="20" fill="#16a34a" opacity="0.8"/>
    <circle cx="470" cy="360" r="22" fill="#15803d" opacity="0.8"/>
  </g>

  <!-- OPEN SIGN -->
  <g id="Sign">
    <rect x="216" y="40" width="80" height="35" rx="17.5" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="256" y="65" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">OPEN</text>
  </g>

  <!-- DEFINITIONS -->
  <defs>
    <linearGradient id="lightGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

  <!-- DEFINITIONS -->
  <defs>
    <linearGradient id="lightGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>