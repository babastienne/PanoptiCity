<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- SKY & ATMOSPHERE -->
  <rect width="512" height="512" fill="#e0f2fe"/>
  <!-- URBAN BACKGROUND (Buildings) -->
  <g id="Buildings">
    <!-- Left Building -->
    <rect x="0" y="150" width="60" height="270" fill="#94a3b8"/>
    <rect x="10" y="180" width="15" height="25" fill="#f1f5f9" opacity="0.5"/>
    <rect x="35" y="180" width="15" height="25" fill="#f1f5f9" opacity="0.5"/>
    <rect x="35" y="220" width="15" height="25" fill="#f1f5f9" opacity="0.5"/>
    <rect x="10" y="260" width="15" height="25" fill="#f1f5f9" opacity="0.5"/>
    <rect x="10" y="300" width="15" height="25" fill="#f1f5f9" opacity="0.5"/>
    <!-- Right Cityscape -->
    <rect x="280" y="100" width="232" height="320" fill="#cbd5e1"/>
    <!-- Windows pattern -->
    <g fill="#f1f5f9" opacity="0.5">
      <rect x="300" y="130" width="25" height="35"/><rect x="340" y="130" width="25" height="35"/><rect x="380" y="130" width="25" height="35"/><rect x="420" y="130" width="25" height="35"/>
      <rect x="300" y="185" width="25" height="35"/><rect x="340" y="185" width="25" height="35"/><rect x="380" y="185" width="25" height="35"/><rect x="420" y="185" width="25" height="35"/>
    </g>
    <!-- Shop Awnings (Marketplace feel) -->
    <path d="M280 280 L512 280 L512 310 L280 310 Z" fill="#1e3a8a" opacity="0.8"/>
    <path d="M280 310 L300 330 L320 310 L340 330 L360 310 L380 330 L400 310 L420 330 L440 310 L460 330 L480 310 L500 330 L512 310" stroke="#1e3a8a" stroke-width="4" fill="none"/>
  </g>

  <!-- GROUND INFRASTRUCTURE -->
  <rect y="420" width="512" height="92" fill="#475569"/> <!-- Asphalt -->
  <rect y="420" width="512" height="12" fill="#94a3b8"/> <!-- Sidewalk Curb -->
  
  <!-- Sewer Grate -->
  <rect x="400" y="460" width="40" height="25" fill="#1e293b"/>
  <path d="M405 465 V480 M415 465 V480 M425 465 V480 M435 465 V480" stroke="#475569" stroke-width="2"/>

  <!-- Zebra Crossing -->
  <g id="Crosswalk" opacity="0.4">
    <rect x="180" y="440" width="80" height="15" fill="white"/>
    <rect x="180" y="470" width="80" height="15" fill="white"/>
    <rect x="180" y="500" width="80" height="15" fill="white"/>
  </g>

  <!-- Bollards & Waste Bin (Street Furniture) -->
  <g id="Street_Furniture">
    <!-- Bollards -->
    <rect x="250" y="380" width="8" height="45" fill="#1e293b" rx="2"/>
    <rect x="350" y="380" width="8" height="45" fill="#1e293b" rx="2"/>
    <!-- Public Waste Bin -->
    <rect x="460" y="360" width="25" height="65" fill="#64748b" rx="2"/>
    <path d="M460 375 H485" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- MUNICIPAL MAST ASSEMBLY -->
  <g id="Mast_Structure">
    <rect x="100" y="20" width="14" height="405" fill="#1e293b"/> <!-- Pole -->
    <rect x="90" y="420" width="34" height="8" fill="#0f172a" rx="2"/> <!-- Base -->
    
    <!-- Junction Box & Cables -->
    <!-- <rect x="95" y="280" width="25" height="35" fill="#64748b" rx="1"/>
    <path d="M107 280 V220 M107 315 V350" stroke="#0f172a" stroke-width="1" opacity="0.5"/> -->
  </g>

  <!-- PUBLIC PROTECTION SIGN (Clamped to pole) -->
  <g id="Sign">
    <rect x="85" y="225" width="45" height="45" fill="#3b82f6" rx="4" stroke="white" stroke-width="2"/>
    <rect x="95" y="240" width="25" height="10" fill="white" rx="1"/>
    <rect x="90" y="225" width="35" height="2" fill="white" opacity="0.5"/>
  </g>

  <!-- INTEGRATED LIGHTING & CAMERAS -->
  <g id="Mast_Head">
    <!-- Street Lamp Arm -->
    <path d="M114 30 H180 Q220 35 220 40" stroke="#1e293b" stroke-width="6" fill="none"/>
    <rect x="200" y="40" width="40" height="10" rx="4" fill="#fbbf24"/>
    
    <!-- Camera Mounting Hub -->
    <rect x="113" y="55" width="60" height="12" fill="#334155" rx="2"/>
    
    <!-- PTZ Speed Dome -->
    <g id="PTZ">
      <rect x="145" y="67" width="26" height="8" fill="#0f172a"/>
      <circle cx="158" cy="95" r="24" fill="#1e293b"/>
      <circle cx="158" cy="95" r="18" fill="#0f172a"/> <!-- Lens Cover -->
      <circle cx="158" cy="98" r="8" fill="#334155" opacity="0.4"/> <!-- Optics -->
      <!-- Blinking LED -->
      <circle cx="168" cy="85" r="2.5" fill="#ef4444">
      </circle>
    </g>

    <!-- Secondary Fixed Bullet -->
    <path d="M100 107 H80 V85" stroke="#334155" stroke-width="4"/>
    <rect x="55" y="85" width="35" height="15" rx="1" fill="#475569"/>
    <rect x="50" y="87" width="5" height="11" rx="1" fill="#1e293b"/>
  </g>
</svg>