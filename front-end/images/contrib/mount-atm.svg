<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="50 45 400 395" xml:space="preserve">
<defs>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#ffffff; stop-opacity:0.2" />
        <stop offset="50%" style="stop-color:#ffffff; stop-opacity:0" />
        <stop offset="100%" style="stop-color:#ffffff; stop-opacity:0.1" />
    </linearGradient>
</defs>

<!-- Main Isometric Housing -->
<!-- Main Face -->
<path d="M60,50 L440,50 L440,430 L60,430 Z" style="fill:#D5DCED;"/>
<path d="M60,50 L250,50 L250,430 L60,430 Z" style="fill:#E4EAF6;"/>

<!-- Top Camera & Sensor Bar -->
<path d="M60,50 H440 V130 H60 Z" style="fill:#464655;"/>
<!-- Glass reflection over camera -->
<path d="M60,50 H440 V130 H60 Z" fill="url(#glass-grad)"/>

<!-- Security Mirror (Left) -->
<circle cx="100" cy="90" r="25" style="fill:#AFB9D2;"/>
<path d="M85,75 Q100,65 115,75" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5"/>

<!-- High-Tech Camera Lens (Center) -->
<circle cx="250" cy="90" r="20" style="fill:#2D2E3B;"/>
<circle cx="250" cy="90" r="12" style="fill:#5B5D6E;"/>
<circle cx="254" cy="86" r="4" style="fill:#ffffff; opacity:0.6;"/>
<!-- Red LED -->
<circle fill="#FF0000" cx="290" cy="90" r="5" />

<!-- Screen Interface -->
<rect x="100" y="160" width="280" height="160" rx="4" style="fill:#2D2E3B;"/>
<g>
    <rect x="115" y="175" width="250" height="130" style="fill:#1e3a8a; opacity:0.3;"/>
    <rect x="130" y="190" width="100" height="6" rx="2" style="fill:#ffffff; opacity:0.4;"/>
    <rect x="130" y="205" width="160" height="6" rx="2" style="fill:#ffffff; opacity:0.4;"/>
    <!-- Button placeholders on screen -->
    <rect x="330" y="230" width="25" height="15" rx="2" style="fill:#3b82f6;"/>
    <rect x="330" y="260" width="25" height="15" rx="2" style="fill:#3b82f6;"/>
</g>

<!-- Receipt Dispenser (Right) -->
<rect x="310" y="340" width="90" height="8" rx="2" style="fill:#959CB5;"/>
<!-- Paper sticking out -->
<path d="M320,348 V370 H390 V348" style="fill:#ffffff;"/>
<path d="M330,355 H380 M330,362 H360" stroke="#AFB9D2" stroke-width="1"/>

<!-- Card Slot (Right) -->
<rect x="310" y="380" width="90" height="12" rx="2" style="fill:#464655;"/>
<rect x="390" y="382" width="6" height="8" rx="1" style="fill:#22c55e;"/> <!-- Green Status light -->

<!-- Tactile Keypad (Left) -->
<g>
    <rect x="100" y="340" width="133" height="70" rx="4" style="fill:#AFB9D2;"/>
    <!-- Keys with 3D effect -->
    <rect x="110" y="350" width="30" height="15" rx="2" style="fill:#959CB5;"/>
    <rect x="110" y="348" width="30" height="15" rx="2" style="fill:#ffffff;"/>
    
    <rect x="150" y="350" width="30" height="15" rx="2" style="fill:#959CB5;"/>
    <rect x="150" y="348" width="30" height="15" rx="2" style="fill:#ffffff;"/>
    
    <rect x="190" y="350" width="30" height="15" rx="2" style="fill:#959CB5;"/>
    <rect x="190" y="348" width="30" height="15" rx="2" style="fill:#ffffff;"/>
    
    <rect x="110" y="370" width="30" height="15" rx="2" style="fill:#959CB5;"/>
    <rect x="110" y="368" width="30" height="15" rx="2" style="fill:#ffffff;"/>
    
    <rect x="150" y="370" width="30" height="15" rx="2" style="fill:#959CB5;"/>
    <rect x="150" y="368" width="30" height="15" rx="2" style="fill:#ffffff;"/>
    
    <rect x="190" y="370" width="30" height="15" rx="2" style="fill:#959CB5;"/>
    <rect x="190" y="368" width="30" height="15" rx="2" style="fill:#ffffff;"/>
    
    <rect x="110" y="390" width="30" height="15" rx="2" style="fill:#959CB5;"/>
    <rect x="110" y="388" width="30" height="15" rx="2" style="fill:#ffffff;"/>
    
    <rect x="150" y="390" width="30" height="15" rx="2" style="fill:#959CB5;"/>
    <rect x="150" y="388" width="30" height="15" rx="2" style="fill:#ffffff;"/>
    
    <rect x="190" y="390" width="30" height="15" rx="2" style="fill:#959CB5;"/>
    <rect x="190" y="388" width="30" height="15" rx="2" style="fill:#ffffff;"/>
</g>

</svg>